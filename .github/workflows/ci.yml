name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run validate:phase5a
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5a-local-match-and-result-evidence
          path: |
            output/phase-5a/e2e
            decks/new-primary-deck/generated/contact-sheets
          if-no-files-found: error
