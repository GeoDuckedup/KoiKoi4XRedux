name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run validate:phase3fa
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3f-a-simplified-table-and-deck-workshop
          path: |
            output/phase-3f-a/e2e
            output/phase-3d-d/e2e
            output/phase-3d-a/visual-directions
            output/phase-2e/e2e
            decks/new-primary-deck/generated/contact-sheets
          if-no-files-found: error
