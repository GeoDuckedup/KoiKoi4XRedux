<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KoiKoi4x — a modern, newcomer-friendly Hanafuda strategy game."
    />
    <meta name="theme-color" content="#10271f" />
    <title>KoiKoi4x</title>
  </head>
  <body>
    <main class="app-shell" aria-labelledby="app-title">
      <header class="app-header">
        <div>
          <p class="eyebrow">Hanafuda strategy · Phase 2A</p>
          <h1 id="app-title">KoiKoi4x</h1>
        </div>
        <button class="fullscreen-button" type="button" data-fullscreen-button>
          Enter fullscreen
        </button>
      </header>

      <section
        class="game-frame"
        aria-label="Responsive KoiKoi4x table layout preview"
        aria-describedby="table-status"
      >
        <div class="game-host" data-game-host></div>
      </section>

      <footer class="app-footer">
        <span id="table-status" data-table-status aria-live="polite"
          >Building the responsive table…</span
        >
        <span><kbd>F</kbd> fullscreen · <kbd>Esc</kbd> exit</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
