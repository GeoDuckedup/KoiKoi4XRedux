<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071511" />
    <title>KoiKoi4x · Dense Field Review</title>
  </head>
  <body data-density-review>
    <main class="app-shell density-review" aria-labelledby="density-review-title">
      <header class="app-header density-review__header">
        <div>
          <p class="eyebrow">Non-shipping presentation harness</p>
          <h1 id="density-review-title">17-card field review</h1>
        </div>
        <p class="density-review__summary" data-density-summary>Loading adaptive field…</p>
      </header>
      <section class="game-frame" aria-label="Technical 17-card adaptive field">
        <div class="game-host" data-game-host></div>
        <div
          class="card-input-overlay"
          data-card-input-overlay
          role="group"
          aria-label="Three legal dense-field targets"
        ></div>
      </section>
    </main>
    <script type="module" src="/src/field-density-review.ts"></script>
  </body>
</html>
